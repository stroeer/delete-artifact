name: Example
# an example workflow that also monitors success of the preview api

on:
  schedule:
    - cron: "0 */6 * * *"
    # every 6 hours

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create test file
        run: echo hello > world.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-artifact
          path: world.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-artifact-2
          path: world.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-artifact-3
          path: world.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: you-artifact
          path: world.txt

      - name: Delete (specific, glob disabled)
        uses: geekyeggo/delete-artifact@65041433121f7239077fa20be14c0690f70569de # v4
        with:
          name: my-artifact
          useGlob: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete (pattern, glob enabled)
        uses: geekyeggo/delete-artifact@65041433121f7239077fa20be14c0690f70569de # v4
        with:
          name: my-*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete (specific, glob enabled)
        uses: geekyeggo/delete-artifact@65041433121f7239077fa20be14c0690f70569de # v4
        with:
          name: you-artifact
          token: ${{ secrets.GITHUB_TOKEN }}
